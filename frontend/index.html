<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b17" />
    <meta name="description" content="Trials of Odysseus: act out scenes from the Odyssey and be judged by the gods of Olympus." />
    <!-- Self-hosted fonts (SIL OFL, latin subset, variable weight): no render-blocking request to
         Google, so first paint and the theme fonts don't depend on the venue wifi. -->
    <link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 400 900; font-display: swap;
        src: url(/fonts/cinzel-latin.woff2) format('woff2'); }
      @font-face { font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
        src: url(/fonts/eb-garamond-latin.woff2) format('woff2'); }
      @font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
        src: url(/fonts/eb-garamond-italic-latin.woff2) format('woff2'); }
    </style>
    <title>Trials of Odysseus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
